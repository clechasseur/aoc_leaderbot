[workspace]
resolver = "3"
members = [
    "aoc_leaderboard",
    "aoc_leaderbot_aws_lambda_impl",
    "aoc_leaderbot_aws_lib",
    "aoc_leaderbot_lib",
    "aoc_leaderbot_slack_lib",
]

[workspace.package]
version = "4.0.0"
authors = [ "Charles Lechasseur <shiftingbeard@outlook.com>" ]
edition = "2024"

license = "MIT"

repository = "https://github.com/clechasseur/aoc_leaderbot"

[workspace.dependencies]
anyhow = "1.0.104"
aoc_leaderboard = { version = "4.0.0", path = "aoc_leaderboard" }
aoc_leaderbot_aws_lib = { version = "4.0.0", path = "aoc_leaderbot_aws_lib" }
aoc_leaderbot_lib = { version = "4.0.0", path = "aoc_leaderbot_lib", default-features = false }
aoc_leaderbot_slack_lib = { version = "4.0.0", path = "aoc_leaderbot_slack_lib" }
aws-config = "1.12.0"
aws-sdk-dynamodb = { version = "1.130.0", default-features = false }
chrono = "0.4.45"
clap = "4.6.7"
derive_builder = "0.20.2"
dotenvy = "0.15.7"
gratte = "3.0.1"
itertools = "0.15.0"
lambda_runtime = "1.4.0"
reqwest = "0.13.5"
rstest = "0.27.0"
serde = "1.0.229"
serde_dynamo = "4.3.0"
serde_json = "1.0.151"
serde_with = "3.24.0"
thiserror = "2.0.21"
tokio = "1.53.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.27.0"
veil = "0.3.0"
wiremock = "0.6.5"

# Dev dependencies:
assert_cmd = "2.2.2"
assert_matches = "1.5.0"
clap-verbosity-flag = "3.0.4"
mockall = "0.15.0"
serial_test = "4.0.1"
test-log = { version = "0.2.21", default-features = false }
testcontainers-modules = "0.15.0"
tracing-test = "0.2.6"
